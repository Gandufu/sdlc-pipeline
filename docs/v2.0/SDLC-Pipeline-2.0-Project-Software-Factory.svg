<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#172b4d"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0052cc"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6554c0"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#00875a"/></marker>
    <marker id="at" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#00a3bf"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}
      .title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#5e6c84}.head{font-size:17px;font-weight:700}
      .label{font-size:14px;font-weight:700;text-anchor:middle}.small{font-size:12px;fill:#5e6c84;text-anchor:middle}
      .group{stroke-width:2;rx:16}.box{stroke-width:2;rx:10}.edge{fill:none;stroke-width:2.4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#fff"/>
  <text x="50" y="62" class="title">终局：项目软件工厂系统</text>
  <text x="50" y="94" class="sub">平台拥有控制面、第一方智能体运行时和执行面；MCP 仅是可选的外部智能体网关</text>

  <rect x="50" y="120" width="1700" height="145" class="group" fill="#f4f5f7" stroke="#7a869a"/>
  <text x="90" y="156" class="head">软件工厂入口</text>
  <g fill="#fff" stroke="#7a869a">
    <rect x="95" y="180" width="250" height="58" class="box"/><rect x="405" y="180" width="250" height="58" class="box"/>
    <rect x="715" y="180" width="250" height="58" class="box"/><rect x="1025" y="180" width="250" height="58" class="box"/>
  </g>
  <rect x="1335" y="180" width="300" height="58" class="box" fill="#fffae6" stroke="#ff991f"/>
  <text x="220" y="216" class="label">项目门户</text><text x="530" y="216" class="label">平台 API / SDK</text>
  <text x="840" y="216" class="label">CI / 事件触发器</text><text x="1150" y="216" class="label">外部智能体宿主</text>
  <text x="1485" y="216" class="label">可选 MCP 网关</text>

  <rect x="50" y="310" width="820" height="340" class="group" fill="#deebff" stroke="#0052cc"/>
  <text x="460" y="348" class="head" text-anchor="middle">软件工厂控制面</text>
  <g fill="#fff" stroke="#0052cc">
    <rect x="80" y="380" width="220" height="62" class="box"/><rect x="340" y="380" width="240" height="62" class="box"/><rect x="620" y="380" width="210" height="62" class="box"/>
    <rect x="80" y="475" width="220" height="62" class="box"/><rect x="340" y="475" width="240" height="62" class="box"/><rect x="620" y="475" width="210" height="62" class="box"/>
  </g>
  <rect x="210" y="570" width="500" height="58" class="box" fill="#e6fcff" stroke="#00a3bf"/>
  <text x="190" y="418" class="label">项目注册表</text><text x="460" y="418" class="label">流程编排器</text><text x="725" y="418" class="label">审批服务</text>
  <text x="190" y="513" class="label">模板注册表</text><text x="460" y="513" class="label">策略注册表</text><text x="725" y="503" class="label"><tspan x="725">发布与</tspan><tspan x="725" dy="19">部署服务</tspan></text>
