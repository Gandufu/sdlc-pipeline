  <g fill="#fff" stroke="#6554c0">
    <rect x="960" y="380" width="220" height="62" class="box"/><rect x="1220" y="380" width="220" height="62" class="box"/><rect x="1480" y="380" width="230" height="62" class="box"/>
    <rect x="960" y="475" width="220" height="62" class="box"/><rect x="1220" y="475" width="220" height="62" class="box"/><rect x="1480" y="475" width="230" height="62" class="box"/>
  </g>
  <rect x="1040" y="570" width="600" height="58" class="box" fill="#fffae6" stroke="#ff991f"/>
  <text x="1070" y="418" class="label">智能体调度器</text><text x="1330" y="418" class="label">模型网关</text><text x="1595" y="418" class="label">上下文编译器</text>
  <text x="1070" y="513" class="label">工具网关</text><text x="1330" y="513" class="label">预算与护栏</text><text x="1595" y="513" class="label">评审与评测运行时</text>
  <text x="1340" y="606" class="label">外部宿主与第一方运行时共享智能体动作契约</text>

  <rect x="50" y="700" width="820" height="300" class="group" fill="#e3fcef" stroke="#00875a"/>
