  <text x="320" y="908" class="label">证据服务</text><text x="600" y="908" class="label">工作区服务</text>

  <rect x="930" y="700" width="820" height="300" class="group" fill="#e6fcff" stroke="#00a3bf"/>
  <text x="1340" y="738" class="head" text-anchor="middle">执行面</text>
  <g fill="#fff" stroke="#00a3bf">
    <rect x="960" y="770" width="220" height="62" class="box"/><rect x="1220" y="770" width="240" height="62" class="box"/><rect x="1500" y="770" width="210" height="62" class="box"/>
    <rect x="1090" y="870" width="220" height="62" class="box"/><rect x="1370" y="870" width="220" height="62" class="box"/>
  </g>
  <text x="1070" y="808" class="label">隔离执行器池</text><text x="1340" y="798" class="label"><tspan x="1340">环境与</tspan><tspan x="1340" dy="19">设备实验室</tspan></text><text x="1605" y="808" class="label">制品存储</text>
  <text x="1200" y="908" class="label">项目 Git 仓库</text><text x="1480" y="908" class="label">框架包与策略包</text>

  <path d="M220 238 V280 H460 V380" class="edge" stroke="#0052cc" marker-end="url(#ab)"/>
  <path d="M530 238 V280 H460 V380" class="edge" stroke="#0052cc" marker-end="url(#ab)"/>
  <path d="M840 238 V280 H460 V380" class="edge" stroke="#0052cc" marker-end="url(#ab)"/>
  <path d="M1150 238 H1335" class="edge" stroke="#ff991f" stroke-dasharray="7 6"/>
  <path d="M1485 238 V282 H780 V380" class="edge" stroke="#ff991f" stroke-dasharray="7 6"/>
  <path d="M580 411 H900 V411 H960" class="edge" stroke="#6554c0" marker-end="url(#ap)"/>
  <text x="875" y="397" class="small">调度</text>
  <path d="M1070 537 V670 H190 V770" class="edge" stroke="#00875a" marker-end="url(#ag)"/>
  <text x="900" y="660" class="small">受控动作</text>
  <path d="M600 932 V1040 H1070 V832" class="edge" stroke="#00a3bf" marker-end="url(#at)"/>
  <path d="M725 537 V675 H1605 V770" class="edge" stroke="#00a3bf" marker-end="url(#at)"/>
  <path d="M190 537 V670 H1480 V870" class="edge" stroke="#00a3bf" marker-end="url(#at)"/>

  <g transform="translate(50 1040)">
    <rect width="1700" height="80" rx="14" fill="#f4f5f7" stroke="#dfe1e6"/>
    <text x="25" y="33" class="head">终局判断</text>
    <text x="25" y="60" class="sub">这不是“云端 MCP 服务器”，而是可独立运行的项目软件工厂；MCP 可存在，也可完全不用。</text>
