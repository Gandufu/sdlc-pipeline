  <g fill="#fff" stroke="#00875a">
    <rect x="80" y="770" width="220" height="62" class="box"/><rect x="340" y="770" width="240" height="62" class="box"/><rect x="620" y="770" width="210" height="62" class="box"/>
    <rect x="210" y="870" width="220" height="62" class="box"/><rect x="490" y="870" width="220" height="62" class="box"/>
