<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#172b4d"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6554c0"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#00875a"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#de350b"/></marker>
    <style>
      .title{font:700 27px "Microsoft YaHei",sans-serif;fill:#172b4d}.rule{font:700 14px "Microsoft YaHei",sans-serif;fill:#172b4d}
      .lane{font:700 15px "Microsoft YaHei",sans-serif;fill:#172b4d}.h{font:700 14px "Microsoft YaHei",sans-serif;fill:#172b4d}
      .t{font:13px "Microsoft YaHei",sans-serif;fill:#172b4d}.s{font:12px "Microsoft YaHei",sans-serif;fill:#42526e}
      .a{fill:none;stroke:#172b4d;stroke-width:2;marker-end:url(#arrow)}.p{fill:none;stroke:#6554c0;stroke-width:2;marker-end:url(#purpleArrow)}
      .g{fill:none;stroke:#00875a;stroke-width:2;marker-end:url(#greenArrow)}.r{fill:none;stroke:#de350b;stroke-width:2;marker-end:url(#redArrow)}
    </style>
  </defs>
  <rect width="1800" height="1400" fill="#fff"/>
  <text x="900" y="48" text-anchor="middle" class="title">SDLC Pipeline：Workspace Checkpoint 与 Project Baseline 全流程</text>
  <rect x="280" y="73" width="1240" height="52" rx="8" fill="#f4f5f7" stroke="#7a869a"/>
  <text x="900" y="104" text-anchor="middle" class="rule">仅两个核心产物：Checkpoint 负责阶段恢复与追溯；Project Baseline 负责项目当前权威事实。TASK 只是递增关联 ID。</text>

  <g><rect x="30" y="145" width="1740" height="180" fill="#fff7e6" stroke="#ff991f" stroke-dasharray="7 5"/><rect x="30" y="145" width="58" height="180" fill="#fff3d6" stroke="#ff991f" stroke-dasharray="7 5"/><text transform="translate(62 302) rotate(-90)" class="lane">A. Session 临时区 · .sdlc-pipeline/work</text></g>
  <g><rect x="30" y="345" width="1740" height="245" fill="#f3f0ff" stroke="#6554c0"/><rect x="30" y="345" width="58" height="245" fill="#eae6ff" stroke="#6554c0"/><text transform="translate(62 555) rotate(-90)" class="lane">B. Workspace Checkpoint · docs/sdlc/checkpoints</text></g>
  <g><rect x="30" y="610" width="1740" height="175" fill="#fff" stroke="#7a869a"/><rect x="30" y="610" width="58" height="175" fill="#f4f5f7" stroke="#7a869a"/><text transform="translate(62 758) rotate(-90)" class="lane">C. 合入与冲突控制</text></g>
  <g><rect x="30" y="805" width="1740" height="270" fill="#e9f2ff" stroke="#0065ff"/><rect x="30" y="805" width="58" height="270" fill="#deebff" stroke="#0065ff"/><text transform="translate(62 1045) rotate(-90)" class="lane">D. Project Baseline · docs/sdlc/project</text></g>
  <g><rect x="30" y="1095" width="1740" height="255" fill="#e3fcef" stroke="#00875a"/><rect x="30" y="1095" width="58" height="255" fill="#dff7eb" stroke="#00875a"/><text transform="translate(62 1325) rotate(-90)" class="lane">E. Task 阶段推进</text></g>

  <g id="session">
    <rect x="110" y="200" width="240" height="72" rx="8" fill="#fff7e6" stroke="#ff991f"/><text x="230" y="229" text-anchor="middle" class="h">创建或恢复 TASK-xxxx</text><text x="230" y="253" text-anchor="middle" class="t">一个 Task 可跨多个 Session</text>
    <rect x="430" y="200" width="250" height="72" rx="8" fill="#fff7e6" stroke="#ff991f"/><text x="555" y="229" text-anchor="middle" class="h">读取当前 Project Baseline</text><text x="555" y="253" text-anchor="middle" class="t">+ 相关未完成 Checkpoint</text>
    <rect x="760" y="190" width="280" height="92" rx="8" fill="#fff7e6" stroke="#ff991f"/><text x="900" y="219" text-anchor="middle" class="h">阶段临时文件</text><text x="900" y="244" text-anchor="middle" class="t">用户输入、模型草稿、未采用内容</text><text x="900" y="267" text-anchor="middle" class="s">不进入正式产物</text>
    <rect x="1120" y="190" width="260" height="92" rx="8" fill="#fff7e6" stroke="#ff991f"/><text x="1250" y="219" text-anchor="middle" class="h">阶段门禁</text><text x="1250" y="244" text-anchor="middle" class="t">SPEC：人工确认</text><text x="1250" y="267" text-anchor="middle" class="t">CODE / TEST：确定性结果</text>
    <rect x="1460" y="190" width="250" height="92" rx="6" fill="#ffebe6" stroke="#de350b"/><text x="1585" y="223" text-anchor="middle" class="h">Checkpoint 写入成功后</text><text x="1585" y="250" text-anchor="middle" class="t">删除对应 Session 临时文件</text>
    <path d="M350 236H430M680 236H760M1040 236H1120" class="a"/>
  </g>

  <g id="checkpoints">
    <rect x="110" y="395" width="210" height="145" rx="8" fill="#eae6ff" stroke="#6554c0"/><text x="130" y="423" class="h">TASK-xxxx/</text><text x="130" y="451" class="t">spec.md</text><text x="130" y="477" class="t">code.md</text><text x="130" y="503" class="t">test.md</text><text x="130" y="529" class="t">index.json</text>
    <rect x="390" y="390" width="290" height="155" rx="8" fill="#eae6ff" stroke="#6554c0"/><text x="535" y="421" text-anchor="middle" class="h">SPEC Checkpoint</text><text x="535" y="449" text-anchor="middle" class="t">需求 / 设计 / 外部接口 / 测试计划</text><text x="535" y="477" text-anchor="middle" class="t">必须人工确认</text><text x="535" y="511" text-anchor="middle" class="h">specified</text>
    <rect x="750" y="390" width="290" height="155" rx="8" fill="#eae6ff" stroke="#6554c0"/><text x="895" y="421" text-anchor="middle" class="h">CODE Checkpoint</text><text x="895" y="449" text-anchor="middle" class="t">改动文件 / 静态检查 / 单元测试</text><text x="895" y="477" text-anchor="middle" class="t">正常自动生成</text><text x="895" y="511" text-anchor="middle" class="h">implemented</text>
    <rect x="1110" y="390" width="300" height="155" rx="8" fill="#eae6ff" stroke="#6554c0"/><text x="1260" y="421" text-anchor="middle" class="h">TEST Checkpoint</text><text x="1260" y="449" text-anchor="middle" class="t">环境绑定 / Runtime / Playwright</text><text x="1260" y="477" text-anchor="middle" class="t">测试轮次追加在同一 test.md</text><text x="1260" y="511" text-anchor="middle" class="h">blocked 或 verified</text>
    <rect x="1480" y="400" width="240" height="135" rx="6" fill="#fff" stroke="#6554c0"/><text x="1600" y="429" text-anchor="middle" class="h">Checkpoint 规则</text><text x="1600" y="457" text-anchor="middle" class="t">一个 Task 只有一套</text><text x="1600" y="483" text-anchor="middle" class="t">不单独编号，可原子更新</text><text x="1600" y="509" text-anchor="middle" class="t">Task 完成后冻结保留</text>
    <path d="M1250 282V355H535V390M680 467H750M1040 467H1110M1410 435H1460V282" class="p"/>
  </g>

  <g id="merge">
    <rect x="260" y="660" width="270" height="76" rx="8" fill="#f4f5f7" stroke="#7a869a"/><text x="395" y="691" text-anchor="middle" class="h">比较基础文档哈希</text><text x="395" y="718" text-anchor="middle" class="t">+ 受影响 R / D / E / T ID</text>
    <polygon points="620,698 708,646 796,698 708,750" fill="#fff" stroke="#7a869a"/><text x="708" y="703" text-anchor="middle" class="h">影响对象冲突？</text>
    <rect x="870" y="650" width="220" height="96" rx="8" fill="#ffebe6" stroke="#de350b"/><text x="980" y="680" text-anchor="middle" class="h">是：停止自动合入</text><text x="980" y="706" text-anchor="middle" class="t">标记 conflict</text><text x="980" y="731" text-anchor="middle" class="t">请求人工确认</text>
    <rect x="1190" y="650" width="250" height="96" rx="8" fill="#e3fcef" stroke="#00875a"/><text x="1315" y="680" text-anchor="middle" class="h">否：确定性增量合入</text><text x="1315" y="706" text-anchor="middle" class="t">不覆盖其他 Task 内容</text><text x="1315" y="731" text-anchor="middle" class="t">更新文档哈希与状态</text>
    <rect x="1510" y="650" width="230" height="96" rx="6" fill="#fff7e6" stroke="#ff991f"/><text x="1625" y="678" text-anchor="middle" class="h">多 Task 并存</text><text x="1625" y="704" text-anchor="middle" class="t">blocked 不妨碍新 Task</text><text x="1625" y="729" text-anchor="middle" class="t">恢复仍使用原 TASK ID</text>
    <path d="M215 540V620H395V660M530 698H620" class="a"/><path d="M796 682H870" class="r"/><path d="M796 716H1190" class="g"/>
  </g>

  <g id="project">
    <rect x="110" y="855" width="260" height="170" rx="8" fill="#deebff" stroke="#0065ff"/><text x="130" y="884" class="h">唯一项目主线</text><text x="130" y="912" class="t">requirements.md</text><text x="130" y="938" class="t">design.md</text><text x="130" y="964" class="t">external-interfaces.md</text><text x="130" y="990" class="t">test.md</text><text x="130" y="1016" class="t">CHANGELOG.md</text>
    <rect x="440" y="865" width="260" height="150" rx="8" fill="#deebff" stroke="#0065ff"/><text x="570" y="896" text-anchor="middle" class="h">项目全局稳定 ID</text><text x="570" y="926" text-anchor="middle" class="t">R-xxxx / D-xxxx / E-xxxx / T-xxxx</text><text x="570" y="956" text-anchor="middle" class="t">不按 Task 重置</text><text x="570" y="986" text-anchor="middle" class="t">废止 ID 不复用</text>
    <rect x="770" y="865" width="210" height="150" rx="8" fill="#deebff" stroke="#0065ff"/><text x="875" y="895" text-anchor="middle" class="h">Task 当前状态</text><text x="875" y="925" text-anchor="middle" class="t">specified</text><text x="875" y="952" text-anchor="middle" class="t">implemented</text><text x="875" y="979" text-anchor="middle" class="t">blocked / verified</text>
    <rect x="1050" y="865" width="300" height="150" rx="8" fill="#deebff" stroke="#0065ff"/><text x="1200" y="895" text-anchor="middle" class="h">CHANGELOG.md 只追加</text><text x="1200" y="925" text-anchor="middle" class="t">日期 + TASK ID + 简写需求 + 状态</text><text x="1200" y="955" text-anchor="middle" class="t">不复制需求、设计、测试</text><text x="1200" y="982" text-anchor="middle" class="t">不复制会话正文</text>
    <rect x="1420" y="860" width="280" height="160" rx="5" fill="#f4f5f7" stroke="#7a869a"/><text x="1560" y="892" text-anchor="middle" class="h">current.json（仅索引）</text><text x="1560" y="922" text-anchor="middle" class="t">文档路径 / 锚点 / 哈希</text><text x="1560" y="950" text-anchor="middle" class="t">last_task_id / Task 状态</text><text x="1560" y="978" text-anchor="middle" class="t">不存正文和敏感值</text>
    <rect x="470" y="1028" width="850" height="35" rx="6" fill="#fff" stroke="#0065ff"/><text x="895" y="1051" text-anchor="middle" class="h">不建快照目录 · 不绑定 Git · 不设 Baseline 编号 · Release 本轮不考虑</text>
    <path d="M1315 746V820H240V855" fill="none" stroke="#0065ff" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g id="states">
    <rect x="120" y="1160" width="190" height="76" rx="8" fill="#e3fcef" stroke="#00875a"/><text x="215" y="1191" text-anchor="middle" class="h">SPEC 确认</text><text x="215" y="1218" text-anchor="middle" class="t">specified</text>
    <rect x="390" y="1160" width="210" height="76" rx="8" fill="#e3fcef" stroke="#00875a"/><text x="495" y="1191" text-anchor="middle" class="h">CODE 门禁通过</text><text x="495" y="1218" text-anchor="middle" class="t">implemented</text>
    <polygon points="690,1198 795,1145 900,1198 795,1251" fill="#fff" stroke="#00875a"/><text x="795" y="1188" text-anchor="middle" class="h">外部环境可用？</text><text x="795" y="1214" text-anchor="middle" class="s">只检查变量是否提供</text><text x="795" y="1234" text-anchor="middle" class="s">不区分真机或 Mock</text>
    <rect x="980" y="1128" width="250" height="100" rx="8" fill="#ffebe6" stroke="#de350b"/><text x="1105" y="1157" text-anchor="middle" class="h">否：blocked</text><text x="1105" y="1183" text-anchor="middle" class="t">记录原因和缺少变量名</text><text x="1105" y="1208" text-anchor="middle" class="t">停止测试，可开始下一 Task</text>
    <rect x="980" y="1240" width="250" height="92" rx="8" fill="#e3fcef" stroke="#00875a"/><text x="1105" y="1268" text-anchor="middle" class="h">是：接口验证 + Runtime</text><text x="1105" y="1293" text-anchor="middle" class="t">+ Playwright</text><text x="1105" y="1317" text-anchor="middle" class="s">失败则同一 test.md 追加 Round</text>
    <rect x="1320" y="1248" width="190" height="76" rx="8" fill="#e3fcef" stroke="#00875a"/><text x="1415" y="1279" text-anchor="middle" class="h">验证通过</text><text x="1415" y="1306" text-anchor="middle" class="t">verified</text>
    <rect x="1450" y="1118" width="250" height="100" rx="6" fill="#fff7e6" stroke="#ff991f"/><text x="1575" y="1147" text-anchor="middle" class="h">外部条件恢复</text><text x="1575" y="1173" text-anchor="middle" class="t">继续原 TASK-xxxx</text><text x="1575" y="1198" text-anchor="middle" class="t">不创建新 Checkpoint ID</text>
    <path d="M310 1198H390M600 1198H690" class="g"/><path d="M900 1178H980" class="r"/><path d="M795 1251V1286H980" class="g"/><path d="M1230 1286H1320" class="g"/>
    <path d="M1230 1155H1450M1575 1118V1080H795V1145" fill="none" stroke="#ff991f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  </g>

  <text x="100" y="1382" class="s">可编辑源文件：Project-Baseline-and-Workspace-Checkpoint.drawio · 不使用 Mermaid</text>
</svg>
