  <text x="770" y="244" class="label"><tspan x="770">智能体修改</tspan><tspan x="770" dy="23">提案 / 代码 / 测试</tspan></text>
  <text x="1075" y="247" class="label">验证门禁</text><text x="1075" y="274" class="small">框架包 + 内核执行器</text>
  <text x="1360" y="250" class="label"><tspan x="1360">确定性</tspan><tspan x="1360" dy="22">裁决</tspan></text>

  <rect x="1330" y="430" width="220" height="100" class="box" fill="#e3fcef" stroke="#00875a"/>
  <rect x="980" y="430" width="220" height="100" class="box" fill="#ffebe6" stroke="#de350b"/>
  <text x="1440" y="468" class="label">通过</text><text x="1440" y="495" class="small">固化证据 · 推进状态</text>
  <text x="1090" y="488" class="label" fill="#bf2600">失败路由器</text>

