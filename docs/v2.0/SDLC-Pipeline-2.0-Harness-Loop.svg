  <text x="810" y="717" class="sub" text-anchor="middle">新失败、新堆栈、新定位、新环境状态或新假设验证；相同指纹重复且无新证据时停止。</text>
  <text x="50" y="855" class="sub">可编辑源文件：SDLC-Pipeline-2.0-Architecture.drawio · 第 4 页</text>
