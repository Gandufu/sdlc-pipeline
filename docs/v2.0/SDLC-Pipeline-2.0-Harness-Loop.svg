  <text x="520" y="434" class="label">测试契约问题 → 测试</text>
  <text x="495" y="530" class="label" fill="#bf2600"><tspan x="495">环境 / 策略 / 预算</tspan><tspan x="495" dy="22">→ 阻塞并转人工</tspan></text>

