  <text x="50" y="94" class="sub">每次尝试都必须携带新的失败增量，并受相同指纹与总预算限制</text>

  <rect x="70" y="210" width="220" height="90" class="box" fill="#deebff" stroke="#0052cc"/>
  <rect x="350" y="210" width="240" height="90" class="box" fill="#eae6ff" stroke="#6554c0"/>
  <rect x="650" y="210" width="240" height="90" class="box" fill="#fffae6" stroke="#ff991f"/>
