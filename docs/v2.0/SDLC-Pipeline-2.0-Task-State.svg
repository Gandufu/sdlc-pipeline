<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#172b4d"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#de350b"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}
      .title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#5e6c84}.label{font-size:16px;font-weight:700;text-anchor:middle}
      .small{font-size:13px;fill:#5e6c84;text-anchor:middle}.box{stroke-width:2;rx:12}.edge{fill:none;stroke-width:2.4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1700" height="1000" fill="#fff"/>
  <text x="50" y="62" class="title">任务状态机：事件驱动、受控返工、证据失效</text>
  <text x="50" y="94" class="sub">内核守卫决定目标状态；模型只能提交事件和证据</text>

  <circle cx="105" cy="235" r="45" fill="#f4f5f7" stroke="#7a869a" stroke-width="2"/>
  <text x="105" y="241" class="label">开始</text>
  <g>
    <rect x="210" y="180" width="190" height="110" class="box" fill="#deebff" stroke="#0052cc"/>
    <rect x="470" y="180" width="190" height="110" class="box" fill="#fffae6" stroke="#ff991f"/>
    <rect x="730" y="180" width="190" height="110" class="box" fill="#eae6ff" stroke="#6554c0"/>
    <rect x="990" y="180" width="190" height="110" class="box" fill="#fffae6" stroke="#ff991f"/>
    <rect x="1250" y="180" width="190" height="110" class="box" fill="#e6fcff" stroke="#00a3bf"/>
    <rect x="1250" y="430" width="190" height="110" class="box" fill="#fffae6" stroke="#ff991f"/>
    <rect x="990" y="430" width="190" height="110" class="box" fill="#e3fcef" stroke="#00875a"/>
    <rect x="730" y="430" width="190" height="110" class="box" fill="#ffebe6" stroke="#de350b"/>
  </g>
  <text x="305" y="225" class="label">草稿</text><text x="305" y="254" class="small">增量提案编辑 / 校验</text>
  <text x="565" y="220" class="label"><tspan x="565">等待规格</tspan><tspan x="565" dy="23">批准</tspan></text>
  <text x="825" y="225" class="label">执行中</text><text x="825" y="254" class="small">实现 + 快速门禁</text>
  <text x="1085" y="220" class="label"><tspan x="1085">等待人工评审</tspan></text><text x="1085" y="254" class="small">人工业务预览</text>
  <text x="1345" y="225" class="label">验收中</text><text x="1345" y="254" class="small">真实运行 / 功能门禁</text>
  <text x="1345" y="470" class="label"><tspan x="1345">等待交付</tspan><tspan x="1345" dy="23">批准</tspan></text>
  <text x="1085" y="493" class="label">已固化</text>
  <text x="825" y="475" class="label">已阻塞</text><text x="825" y="505" class="small">环境 / 预算 / 重复失败</text>

  <path d="M150 235 H210" class="edge"/>
  <path d="M400 235 H470" class="edge"/><text x="435" y="218" class="small">校验通过</text>
  <path d="M660 235 H730" class="edge"/><text x="695" y="212" class="small">人工批准</text>
  <path d="M920 235 H990" class="edge"/><text x="955" y="212" class="small">快速门禁通过</text>
  <path d="M1180 235 H1250" class="edge"/><text x="1215" y="212" class="small">评审接受</text>
  <path d="M1345 290 V430" class="edge"/><text x="1435" y="365" class="small">强制门禁通过</text>
  <path d="M1250 485 H1180" class="edge"/><text x="1215" y="468" class="small">人工批准</text>

  <path d="M1085 290 V355 H825 V290" class="edge" stroke="#de350b" marker-end="url(#ar)" stroke-dasharray="7 6"/>
  <text x="955" y="340" class="small" fill="#bf2600">实现问题反馈</text>
  <path d="M1345 180 V120 H305 V180" class="edge" stroke="#de350b" marker-end="url(#ar)" stroke-dasharray="7 6"/>
  <text x="825" y="110" class="small" fill="#bf2600">需求 / 设计问题反馈</text>
  <path d="M875 290 V430" class="edge" stroke="#de350b" marker-end="url(#ar)"/>
  <text x="975" y="370" class="small" fill="#bf2600">环境 / 预算 / 重复失败</text>
  <path d="M775 430 V290" class="edge" stroke="#6554c0" stroke-dasharray="7 6"/>
  <text x="645" y="370" class="small">人工决策后恢复</text>

  <rect x="210" y="680" width="1230" height="100" rx="14" fill="#f4f5f7" stroke="#7a869a" stroke-width="2"/>
  <text x="825" y="720" class="label">返工规则</text>
  <text x="825" y="753" class="sub" text-anchor="middle">保留历史证据，只失效受影响的下游门禁运行与批准；已固化后的问题创建关联新任务。</text>
  <g transform="translate(210 825)">
    <rect width="385" height="65" rx="10" fill="#deebff" stroke="#0052cc"/>
    <rect x="420" width="385" height="65" rx="10" fill="#ffebe6" stroke="#de350b"/>
    <rect x="840" width="390" height="65" rx="10" fill="#e3fcef" stroke="#00875a"/>
    <text x="192" y="39" class="label">蓝/紫：智能体执行态</text>
    <text x="612" y="39" class="label">红：阻塞或返工</text>
    <text x="1035" y="39" class="label">绿：不可回退终态</text>
  </g>
  <text x="50" y="955" class="sub">可编辑源文件：SDLC-Pipeline-2.0-Architecture.drawio · 第 3 页</text>
</svg>
